<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fherrmann.com</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --card-bg: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --border: #e5e5e7;
    --accent: #0071e3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0d0f;
      --card-bg: #1c1c1e;
      --text: #f5f5f7;
      --muted: #9a9a9e;
      --border: #2e2e30;
      --accent: #4da3ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 3rem 1.5rem;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    text-align: center;
    margin-bottom: 2.5rem;
  }
  h1 {
    font-size: 2rem;
    font-weight: 600;
    margin: 0 0 0.4rem;
  }
  header p {
    color: var(--muted);
    margin: 0;
    font-size: 1rem;
  }
  .links {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 1rem;
    width: 100%;
    max-width: 720px;
  }
  a.card {
    display: block;
    padding: 1.25rem 1.5rem;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    text-decoration: none;
    color: var(--text);
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  a.card:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
  }
  .card .name {
    font-size: 1.05rem;
    font-weight: 600;
    margin-bottom: 0.25rem;
  }
  .card .desc {
    font-size: 0.875rem;
    color: var(--muted);
  }
  footer {
    margin-top: 3rem;
    font-size: 0.8rem;
    color: var(--muted);
  }
</style>
</head>
<body>
  <header>
    <h1>Felix Herrmann</h1>
    <p>A few things I run</p>
  </header>

  <main class="links">
    <a class="card" href="https://blog.fherrmann.com">
      <div class="name">Blog</div>
      <div class="desc">Felix' Blog</div>
    </a>
    <a class="card" href="https://status.fherrmann.com">
      <div class="name">Status</div>
      <div class="desc">Service status board</div>
    </a>
    <a class="card" href="https://firefly.fherrmann.com">
      <div class="name">Firefly</div>
      <div class="desc">Personal finance manager</div>
    </a>
    <a class="card" href="https://weight.fherrmann.com">
      <div class="name">Weight</div>
      <div class="desc">Weight tracker</div>
    </a>
    <a class="card" href="https://hymods.de">
      <div class="name">hymods.de</div>
      <div class="desc">HYMODS</div>
    </a>
  </main>

  <footer>&copy; <span id="year"></span> Felix Herrmann · <a href="https://cv.fherrmann.com" style="color: var(--muted); text-decoration: underline;">CV</a></footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
